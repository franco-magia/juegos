<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101428">
<title>Juegos 3D · Franco Magia</title>
<link rel="icon" type="image/png" href="../img/icono.png">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    color:#ffd040;font:bold 16px ui-monospace,monospace;background:#101428;text-align:center;padding:16px}
  #cargando a{color:#9fd0ff}
</style>
</head>
<body>
<div id="cargando">CARGANDO EL JUEGO 3D...<a href="../">volver a los juegos</a></div>
<script src="juegos3d.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), juego=q.get('juego');
  function alPortal(){ location.href='../'; }
  function arrancar(){
    var c=document.getElementById('cargando'); if(c) c.remove();
    if(juego){
      // abre directo ese juego; al salir del 3D vuelve al portal
      Juegos3D.abrir(alPortal);
      try{ Juegos3D.ir(juego); }catch(e){}
    } else {
      Juegos3D.abrir(alPortal);
    }
  }
  if(document.readyState==='complete') arrancar(); else window.addEventListener('load',arrancar);
})();
</script>
</body>
</html>
